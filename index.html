<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好感工具</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#87cefa">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;}
        body{
            background:#f7f3ec; /* 暖米白底 */
            color:#333842;     /*正文文字色*/
            padding:12px;
            max-width:1000px;
            margin:0 auto;
        }
        .page{display:none;}
        .page.active{display:block;}

        nav{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
        /* 冰蓝主按钮 */
        nav button{
            padding:11px 16px;
            border:none;
            background:#87cefa;
            color:#222832;
            border-radius:12px;
            font-size:14px;
            cursor:pointer;
            box-shadow: 0 2px 8px rgba(135,206,250,0.25);
            transition:0.2s ease;
        }
        nav button:hover{
            background:#70b9e6;
            transform: translateY(-1px);
        }

        /* =====玻璃拟态卡片===== */
        .card{
            background:rgba(255,255,255,0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border:1px solid rgba(255,255,255,0.65);
            border-radius:18px;
            padding:20px;
            margin-bottom:14px;
            box-shadow: 0 4px 16px rgba(51,56,66,0.08);
        }

        .row{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap;}

        input{
            padding:9px 11px;
            border:1px solid #d8d2c8;
            border-radius:10px;
            font-size:14px;
            background:rgba(255,255,255,0.6);
            color:#333842;
        }
        textarea{
            width:100%;
            min-height:130px;
            padding:12px;
            border:1px solid #d8d2c8;
            border-radius:12px;
            font-size:14px;
            background:rgba(255,255,255,0.6);
            color:#333842;
        }

        /* 小按钮组：冰蓝 / 薄荷青 /淡紫 */
        button.small{
            padding:7px 12px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            font-size:13.5px;
            transition:0.2s;
        }
        button.small:nth-of-type(1){background:#87cefa;color:#222832;} /*冰蓝*/
        button.small:nth-of-type(2){background:#b2e8d8;color:#222832;} /*薄荷青*/
        button.small:nth-of-type(3){background:#d8cff2;color:#222832;} /*淡紫*/
        button.small:hover{filter:brightness(1.05);transform: translateY(-1px);}

        .log-item{
            padding:10px 0;
            border-bottom:1px solid rgba(51,56,66,0.1);
            font-size:13px;
            line-height:1.55;
        }
        h1,h3,h4{
            color:#333842;
            margin-bottom:12px;
        }
        p{font-size:12px;color:#5c626e;}
    </style>
</head>
<body>
    <h1>好感工作台</h1>
    <nav>
        <button data-page="page-home">角色总览</button>
        <button data-page="page-detail">角色详情</button>
        <button data-page="page-log">全部事件日志</button>
        <button data-page="page-setting">设置</button>
    </nav>

    <!-- 角色总览页 -->
    <div id="page-home" class="page active">
        <div class="card">
            <h3>角色好感列表</h3>
            <div id="charList"></div>
        </div>
    </div>

    <!-- 角色详情页 -->
    <div id="page-detail" class="page">
        <div class="card">
            <h3>角色详情</h3>
            <div class="row">
                <label>选择角色:</label>
                <select id="detailSelect">
                </select>
            </div>
            <div class="row">
                <span>当前好感：</span>
                <input type="number" id="detailVal">
                <button class="small" id="btnAdd">+</button>
                <button class="small" id="btnSub">-</button>
                <span>步长：<input type="number" id="stepInput" value="1"></span>
            </div>
            <div class="row">
                <label>本次变动事件记录：</label>
            </div>
            <textarea id="eventNote" placeholder="记录发生了什么剧情事件"></textarea>
            <div class="row">
                <button class="small" id="saveChange">保存本次变动</button>
            </div>
            <h4 style="margin-top:14px;">该角色历史记录</h4>
            <div id="charLogBox"></div>
        </div>
    </div>

    <!-- 全部事件日志页 -->
    <div id="page-log" class="page">
        <div class="card">
            <h3>全局全部好感变动日志</h3>
            <div id="allLogBox"></div>
        </div>
    </div>

    <!-- 设置页 -->
    <div id="page-setting" class="page">
        <div class="card">
            <h3>设置</h3>
            <div class="row">
                <button class="small" id="exportData">导出全部数据(JSON)</button>
                <button class="small" id="resetAll">重置全部数据</button>
            </div>
            <p style="font-size:12px;color:#5c626e;margin-top:10px;">数据保存在浏览器本地存储，清除浏览器缓存会丢失。</p>
        </div>
    </div>

<script>
// 默认8角色初始数据
const DEFAULT_DATA = {
    step:1,
    chars:[
        {id:1,name:"角色A",favor:50},
        {id:2,name:"角色B",favor:50},
        {id:3,name:"角色C",favor:50},
        {id:4,name:"角色D",favor:50},
        {id:5,name:"角色E",favor:50},
        {id:6,name:"角色F",favor:50},
        {id:7,name:"角色G",favor:50},
        {id:8,name:"角色H",favor:50},
    ],
    logs:[]
};

let appData = JSON.parse(localStorage.getItem("favorToolData")) || JSON.parse(JSON.stringify(DEFAULT_DATA));

// 保存本地存储
function saveStorage(){
    localStorage.setItem("favorToolData",JSON.stringify(appData));
}

// 页面切换
document.querySelectorAll("nav button").forEach(btn=>{
    btn.onclick=()=>{
        const targetId = btn.dataset.page;
        document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
        document.getElementById(targetId).classList.add("active");
        renderPage();
    }
})

// 渲染全部页面
function renderPage(){
    renderHome();
    renderDetailSelect();
    renderAllLog();
}

// 首页角色列表
function renderHome(){
    const box = document.getElementById("charList");
    box.innerHTML = "";
    appData.chars.forEach((c,idx)=>{
        const div = document.createElement("div");
        div.className = "row";
        div.innerHTML = `
            <span>${c.name}</span>
            <input value="${c.name}" data-idx="${idx}" class="editName">
            <span>好感：${c.favor}</span>
        `
        box.appendChild(div);
    })
    //修改名字
    document.querySelectorAll(".editName").forEach(input=>{
        input.onchange=()=>{
            const i = Number(input.dataset.idx);
            appData.chars[i].name = input.value.trim();
            saveStorage();
            renderPage();
        }
    })
}

//详情页下拉选择
function renderDetailSelect(){
    const sel = document.getElementById("detailSelect");
    sel.innerHTML = "";
    appData.chars.forEach((c,idx)=>{
        const opt = document.createElement("option");
        opt.value = idx;
        opt.innerText = c.name;
        sel.appendChild(opt);
    })
    bindDetail();
}

//详情页绑定
function bindDetail(){
    const idx = Number(document.getElementById("detailSelect").value);
    const char = appData.chars[idx];
    document.getElementById("detailVal").value = char.favor;
    document.getElementById("stepInput").value = appData.step;
    renderCharLog(idx);
}

//渲染单个角色日志
function renderCharLog(charIdx){
    const char = appData.chars[charIdx];
    const box = document.getElementById("charLogBox");
    const list = appData.logs.filter(l=>l.charId===char.id);
    box.innerHTML = list.length===0?"暂无记录":list.map(item=>`
        <div class="log-item">
            <div>${item.time}｜好感变动 ${item.delta} → 当前${item.afterVal}</div>
            <div>备注：${item.note||"无"}</div>
        </div>
    `).join("");
}

//渲染全局日志
function renderAllLog(){
    const box = document.getElementById("allLogBox");
    box.innerHTML = appData.logs.length===0?"暂无事件日志":appData.logs.map(item=>`
        <div class="log-item">
            <div>${item.time}｜【${item.charName}】变动 ${item.delta} → ${item.afterVal}</div>
            <div>备注：${item.note||"无"}</div>
        </div>
    `).join("");
}

//详情页事件
document.getElementById("detailSelect").onchange = bindDetail;

document.getElementById("btnAdd").onclick=()=>{
    const idx = Number(document.getElementById("detailSelect").value);
    const step = Number(document.getElementById("stepInput").value)||1;
    const char = appData.chars[idx];
    char.favor += step;
    document.getElementById("detailVal").value = char.favor;
}
document.getElementById("btnSub").onclick=()=>{
    const idx = Number(document.getElementById("detailSelect").value);
    const step = Number(document.getElementById("stepInput").value)||1;
    const char = appData.chars[idx];
    char.favor -= step;
    document.getElementById("detailVal").value = char.favor;
}

//保存变动写入日志
document.getElementById("saveChange").onclick = ()=>{
    const idx = Number(document.getElementById("detailSelect").value);
    const char = appData.chars[idx];
    const newVal = Number(document.getElementById("detailVal").value);
    const note = document.getElementById("eventNote").value.trim();
    const delta = newVal - char.favor;
    char.favor = newVal;
    appData.step = Number(document.getElementById("stepInput").value)||1;

    const logItem = {
        charId:char.id,
        charName:char.name,
        beforeVal:char.favor-delta,
        afterVal:char.favor,
        delta:delta,
        note:note,
        time:new Date().toLocaleString()
    }
    appData.logs.push(logItem);
    saveStorage();
    document.getElementById("eventNote").value = "";
    renderPage();
}

//导出数据
document.getElementById("exportData").onclick=()=>{
    const str = JSON.stringify(appData,null,2);
    const blob = new Blob([str],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "好感工作台数据.json";
    a.click();
}

//重置全部
document.getElementById("resetAll").onclick=()=>{
    if(confirm("确定全部清空？所有角色、日志全部丢失，不可恢复！")){
        appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
        saveStorage();
        renderPage();
    }
}

//初始化渲染
renderPage();

//PWA ServiceWorker注册
if('serviceWorker' in navigator){
    window.addEventListener("load",()=>{
        navigator.serviceWorker.register("./sw.js").catch(err=>console.log("sw注册失败：",err))
    })
}
</script>
</body>
</html>
<div class="tab-bar">
    <div class="tab-item active" data-page="page-home">总览</div>
    <div class="tab-item" data-page="page-detail">角色详情</div>
    <div class="tab-item" data-page="page-log">事件日志</div>
    <div class="tab-item" data-page="page-setting">设置</div>
</div>

<script>
//好感等级规则
function getFavorLevel(val){
    if(val <=0) return {text:"陌生",cls:"level-0"};
    if(val <=20) return {text:"初识",cls:"level-1"};
    if(val <=50) return {text:"友好",cls:"level-2"};
    if(val <=80) return {text:"亲近",cls:"level-3"};
    if(val <=120) return {text:"知己",cls:"level-4"};
    return {text:"倾心",cls:"level-5"};
}

// 默认初始化数据
let defaultData = {
    step:5,
    characters:[
        {id:0,name:"角色A",favor:0},
        {id:1,name:"角色B",favor:0},
        {id:2,name:"角色C",favor:0},
        {id:3,name:"角色D",favor:0},
        {id:4,name:"角色E",favor:0},
        {id:5,name:"角色F",favor:0},
        {id:6,name:"角色G",favor:0},
        {id:7,name:"角色H",favor:0},
    ],
    logs:[],
    selectCharId:0
}

//弹窗临时缓存
let popCache = {charId:0,delta:0};

// 读取本地存储
function loadStorage(){
    let str = localStorage.getItem("favor_workspace");
    if(str){
        return JSON.parse(str);
    }else{
        return JSON.parse(JSON.stringify(defaultData));
    }
}
let appData = loadStorage();

//保存本地存储
function saveStorage(){
    localStorage.setItem("favor_workspace",JSON.stringify(appData));
}

// 添加日志（支持备注）
function addLog(charId, delta, desc=""){
    let char = appData.characters[charId];
    let time = new Date().toLocaleString();
    let logItem = {
        time,
        charId,
        charName:char.name,
        delta,
        desc,
        afterValue:char.favor
    }
    appData.logs.unshift(logItem);
    saveStorage();
}

//渲染总览列表
function renderHome(){
    let dom = document.getElementById("favor-list");
    let html = "";
    appData.characters.forEach((c,idx)=>{
        let lv = getFavorLevel(c.favor);
        html += `
        <div class="row-item">
            <input value="${c.name}" onchange="changeName(${idx},this.value)" style="width:110px;">
            <span>好感：${c.favor}</span>
            <span class="level-tag ${lv.cls}">${lv.text}</span>
            <button class="btn-minus" onclick="openNotePop(${idx},-appData.step)">−</button>
            <button class="btn-plus" onclick="openNotePop(${idx},appData.step)">+</button>
            <button class="btn-primary" onclick="openDetail(${idx})">详情</button>
        </div>
        `
    })
    dom.innerHTML = html;
}

// 修改角色名字
function changeName(id,newName){
    appData.characters[id].name = newName;
    saveStorage();
    renderHome();
}

//打开备注弹窗
function openNotePop(charId,delta){
    popCache.charId = charId;
    popCache.delta = delta;
    const c = appData.characters[charId];
    document.getElementById("pop‑charname").innerText = c.name;
    document.getElementById("pop‑delta").innerText = delta>0?`+${delta}`:delta;
    document.getElementById("pop‑note").value = "";
    document.getElementById("popNote").classList.add("show");
}
function closePop(){
    document.getElementById("popNote").classList.remove("show");
}
//确认好感变更
function confirmFavorChange(){
    const note = document.getElementById("pop‑note").value.trim();
    const {charId,delta}=popCache;
    appData.characters[charId].favor += delta;
    addLog(charId,delta,note);
    closePop();
    renderHome();
    renderLogPage();
    if(appData.selectCharId === charId){
        renderDetail();
    }
}

//打开角色详情
function openDetail(id){
    appData.selectCharId = id;
    saveStorage();
    renderDetail();
    switchPage("page-detail");
}

//渲染详情页
function renderDetail(){
    let c = appData.characters[appData.selectCharId];
    let lv = getFavorLevel(c.favor);
    document.getElementById("detail-name").innerText = c.name;
    document.getElementById("detail-value").innerText = c.favor;
    document.getElementById("detail-level").innerText = lv.text;
    document.getElementById("detail-level").className = "level-tag "+lv.cls;

    let detailLogDom = document.getElementById("detail-log");
    let filterLog = appData.logs.filter(l=>l.charId === appData.selectCharId);
    let h = "";
    filterLog.forEach(l=>{
        h += `<div class="log-item">[${l.time}] ${l.delta>0?"+"+l.delta:l.delta} → ${l.afterValue}
        ${l.desc?`<div class="log-note">📝${l.desc}</div>`:""}
        </div>`
    })
    detailLogDom.innerHTML = h || "<div style='color:#888'>暂无记录</div>";
}

//渲染全局日志页面
function renderLogPage(){
    let dom = document.getElementById("global-log");
    let h = "";
    appData.logs.forEach(l=>{
        h += `<div class="log-item">[${l.time}]【${l.charName}】 ${l.delta>0?"+"+l.delta:l.delta}，当前：${l.afterValue}
        ${l.desc?`<div class="log-note">📝${l.desc}</div>`:""}
        </div>`
    })
    dom.innerHTML = h || "<div style='color:#888'>暂无事件记录</div>";
}

//设置页步长
function saveStep(){
    let v = Number(document.getElementById("step-input").value);
    appData.step = v;
    saveStorage();
    alert("步长已保存");
}

//导出数据
function exportData(){
    let blob = new Blob([JSON.stringify(appData,null,2)],{type:"application/json"});
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = "好感工作台备份.json";
    a.click();
}

//导入备份文件
function importBackup(inputEl){
    const file = inputEl.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload=e=>{
        try{
            const restore = JSON.parse(e.target.result);
            if(!restore.characters || !restore.logs){
                alert("备份文件格式错误！");
                return;
            }
            if(!confirm("导入将覆盖当前全部数据！确认继续？")) return;
            appData = restore;
            saveStorage();
            renderAll();
            alert("导入备份成功");
        }catch(err){
            alert("读取JSON失败");
        }
    }
    reader.readAsText(file);
}

//重置全部数据
function resetAllData(){
    if(!confirm("确认清空所有角色、好感、日志？不可恢复！")) return;
    localStorage.removeItem("favor_workspace");
    appData = JSON.parse(JSON.stringify(defaultData));
    saveStorage();
    renderAll();
}

//页面切换
function switchPage(pageId){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(pageId).classList.add("active");
    document.querySelectorAll(".tab-item").forEach(t=>t.classList.remove("active"));
    document.querySelector(`.tab-item[data-page="${pageId}"]`).classList.add("active");
}

//底部tab绑定点击
document.querySelectorAll(".tab-item").forEach(tab=>{
    tab.onclick = function(){
        let pid = this.getAttribute("data-page");
        switchPage(pid);
        if(pid === "page-log") renderLogPage();
        if(pid === "page-setting"){
            document.getElementById("step-input").value = appData.step;
        }
    }
})

// ---------------- PWA安装逻辑 ----------------
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById("installBtn").style.display="block";
});
async function pwaInstall(){
    if(!deferredPrompt){
        alert("当前浏览器不支持一键安装；Safari请点分享按钮→添加到主屏幕");
        return;
    }
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    alert(outcome==="accepted"?"已添加桌面":"取消安装");
}

function renderAll(){
    renderHome();
    renderLogPage();
    renderDetail();
    document.getElementById("step-input").value = appData.step;
}

//初始化
renderAll();
</script>
</body>
</html>
